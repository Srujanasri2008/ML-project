[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic_noma_ofdma"
version = "0.1.0"
description = "Soft Actor-Critic-Based Semantic-Aware Power and Time Allocation for Hybrid NOMA–OFDMA Networks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.1.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "gymnasium>=0.29.1,<1.1.0",
    "stable-baselines3>=2.3.0",
    "tensorboard>=2.15.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
